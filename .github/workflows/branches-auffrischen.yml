name: Branches auffrischen

# Wiederverwendbarer Workflow (workflow_call), unabhaengig von einem
# Auftragslabel: bringt offene Branches per echtem Rebase auf den Stand ihrer
# Basis (f-reiser/reiser-flow#7). Ein Projekt bindet ihn bei jedem PR-Merge
# nach main und einmal naechtlich ein:
#
#   on:
#     pull_request:
#       types: [closed]
#     schedule: [{ cron: "17 2 * * *" }]
#     workflow_dispatch:
#   jobs:
#     branches-auffrischen:
#       if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch)
#       uses: f-reiser/reiser-flow/.github/workflows/branches-auffrischen.yml@<tag>
#       permissions:            # MUSS der Aufrufer setzen, siehe unten
#         contents: write
#         pull-requests: read
#         id-token: write
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# WARUM DAS GANZE GITHUB-ARBEIT IST UND CLAUDE NUR DIE AUSNAHME
# branches_synchronisieren.py rebast jeden Branch fuer sich per "git" und
# pusht bei Erfolg - ohne Modell, ohne Kosten. Claude startet NUR, wenn ein
# echter Konflikt bleibt, und dann EINMAL fuer ALLE an diesem Lauf noch
# konfliktbehafteten Branches zusammen, nicht je Branch einzeln: Jeder
# Claude-Start bezahlt Skills und Projektstruktur neu, das soll ein Lauf
# hoechstens einmal tun.
#
# WARUM BEI JEDEM PR-MERGE, NICHT NUR NAECHTLICH
# Haengen mehrere offene Pull Requests voneinander ab (git-branch-strategie,
# "Blockierte Issues"), veraltet der naechste in der Kette genau in dem
# Moment, in dem der vorige nach main gemerged wird. Auf den naechsten
# naechtlichen Lauf zu warten waere dafuer zu traege.
#
# Fehlt eine Berechtigung beim Aufrufer, faellt "contents: write" zuerst auf:
# Ohne sie kann der Rebase nicht gepusht werden, und jeder Branch landet als
# Konflikt beim Modell - auch der, der sich klaglos rebasen liesse.

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >
          OAuth-Token fuer anthropics/claude-code-action, nur gebraucht, wenn
          ein Rebase tatsaechlich an einem echten Konflikt haengen bleibt.
        required: true

permissions:
  contents: write
  #  Fuer basen.txt: die Basis (baseRefName) jedes offenen Pull Requests.
  pull-requests: read
  id-token: write

jobs:
  auffrischen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    #  Ein Lauf je Repository zur Zeit: Zwei gleichzeitige Laeufe wuerden
    #  denselben Branch parallel rebasen und sich gegenseitig die
    #  "--force-with-lease"-Pruefung wegschiessen.
    concurrency:
      group: branches-auffrischen-${{ github.repository }}
      cancel-in-progress: false

    steps:
      #  Das PROJEKT - Zugangsdaten fuer den Push kommen von hier.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      #  Skripte UND Skills aus genau dem Commit, aus dem auch diese Datei
      #  stammt - derselbe Vertrag wie in claude-aufgaben.yml, dieselbe
      #  Begruendung dort (job.workflow_sha statt github.workflow_sha).
      - name: reiser-flow aus genau diesem Commit holen
        env:
          SHA: ${{ job.workflow_sha }}
        run: |
          Z="$RUNNER_TEMP/reiser-flow"
          git init -q "$Z"
          git -C "$Z" remote add origin https://github.com/f-reiser/reiser-flow.git
          git -C "$Z" fetch -q --depth 1 origin "$SHA"
          git -C "$Z" checkout -q FETCH_HEAD
          echo "reiser-flow bei $SHA"

      #  Reine GitHub-Arbeit, kein Claude: alle Branches und die Basis jedes
      #  offenen, NICHT von einem Fork stammenden Pull Requests einsammeln,
      #  dann synchronisieren. Ein Branch ohne offenen Pull Request bekommt
      #  keinen Eintrag in basen.txt und laeuft gegen "main" (Voreinstellung
      #  in veraltete_branches.py).
      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh api --paginate "repos/$GITHUB_REPOSITORY/branches" \
            --jq '.[].name' 2>/dev/null > branches.txt || true

          gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName,baseRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | [.headRefName, .baseRefName] | @tsv' \
            2>/dev/null > basen.txt || true

          python3 "$RUNNER_TEMP/reiser-flow/.github/skripte/branches_synchronisieren.py"

      #  Ersatzmass fuer die Dauer, nur gebraucht, wenn Claude ueberhaupt
      #  laeuft - dieselbe Begruendung wie in claude-aufgaben.yml.
      - id: uhr
        if: steps.sync.outputs.konflikte != ''
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      #  Nur dieser eine Schritt startet ein Modell, und nur, wenn nach dem
      #  GitHub-Teil oben ueberhaupt noch ein echter Konflikt uebrig ist.
      - id: claude
        if: steps.sync.outputs.konflikte != ''
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de  # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --plugin-dir ${{ runner.temp }}/reiser-flow/plugins/reiser-flow
            --max-turns 150
            --permission-mode acceptEdits
            --allowedTools "Bash(gh *),Bash(git *),Bash(python3 *),Bash(python *)"
            --disallowedTools "Bash(gh pr merge *),Bash(gh release *),Bash(gh workflow *),Bash(gh secret *),Bash(gh variable *),Bash(gh label *),Bash(gh repo delete *)"
          prompt: |
            Diese Branches liessen sich nicht automatisch auf ihre Basis
            rebasen: ${{ steps.sync.outputs.konflikte }}

            Fuer JEDEN genannten Branch, in einem Lauf:

            1. `git fetch origin` und den Branch auschecken.
            2. Seine Basis ermitteln: `gh pr list --head <branch> --json
               baseRefName --jq '.[0].baseRefName'`, ohne Treffer "main".
            3. `git rebase origin/<basis>` erneut versuchen, den Konflikt
               nach git-branch-strategie ("Merge-Konflikte loest du")
               inhaltlich aufloesen - beide Seiten lesen, nicht nur
               technisch zusammenfuegen.
            4. Tests des Projekts (falls vorhanden) gruen sehen, dann
               `git push --force-with-lease origin <branch>`.

            Kein Merge, kein Force-Push auf main, kein --no-verify, keine
            Aenderung an .github/workflows/*. Bleibt ein Branch nach
            ernsthaftem Versuch unklar, lass genau ihn stehen, mach die
            uebrigen trotzdem fertig und nenne in der Rueckmeldung, welcher
            es war und woran es haengt.
