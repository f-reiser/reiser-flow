name: Selbst-Label-Waechter

# reiser-flow wendet label-waechter.yml auf sich selbst an, damit die
# Steuerlabel auch hier geschuetzt sind (f-reiser/reiser-flow#11) - ueber den
# lokalen Pfad, damit dieser Lauf den Stand des eigenen main ausfuehrt.

on:
  issues:
    types: [labeled, edited]
  #  Ohne diese beiden merkt der Waechter nicht, dass sich ein freigegebener
  #  Vorgang nach der Freigabe geaendert hat (f-reiser/reiser-flow#23).
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [labeled, edited]

jobs:
  label-waechter:
    uses: ./.github/workflows/label-waechter.yml
    permissions:
      issues: write
      pull-requests: write
      actions: read
