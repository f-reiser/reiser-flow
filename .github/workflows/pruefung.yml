name: Pruefung

# Einmal enthielt dieses Repository nur Prosa, und die einzige Zusage, die ein Werkzeug
# halten konnte, hielt "claude plugin tag" beim Release. Mit dem zweiten Plugin galt das
# nicht mehr: Der Gleichlauf der Versionen ZWISCHEN den Plugins ist eine Zusage, die
# "claude plugin tag" strukturell nicht pruefen kann, weil es je Aufruf nur ein Plugin
# sieht.
#
# Seit die gemeinsamen Workflows hier liegen, wiegt jeder Fehler mehr: Er faellt nicht
# in diesem Repository auf, sondern in einem fremden Projekt, das sich einen Tag von hier
# holt. Deshalb laufen die Selbsttests ALLER Skripte hier - und nicht bei den Projekten,
# die sie einbinden. Die haben nichts davon, die Unit-Tests einer fremden Bibliothek bei
# jedem Push mitlaufen zu lassen; geprueft gehoert das, wo es geaendert wird.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Marketplace und Plugins
        run: python .github/pruefe_marketplace.py

      #  Eine Pruefung ohne Mutation zaehlt nicht: Der Selbsttest weist nach, dass jeder
      #  Befund oben wirklich anschlaegt, statt nur gruen zu leuchten.
      - name: Selbsttest der Pruefung
        run: python .github/pruefe_marketplace.py --selbsttest

      #  Die Workflows selbst. Sie laufen in FREMDEN Projekten - ein Fehler hier faellt
      #  sonst dort auf, und zwar dem, der ihn nicht verursacht hat.
      - name: Workflows
        run: python .github/pruefe_workflows.py

      - name: Selbsttest der Workflow-Pruefung
        run: python .github/pruefe_workflows.py --selbsttest

      - name: Selbsttest des Issue-Autoclose-Workflows
        run: python .github/skripte/issue_autoclose.py --selbsttest

      #  Die Zuordnung entscheidet, an welchem Vorgang der naechste unbeaufsichtigte
      #  Lauf weiterarbeitet. Ein Fehler darin faellt sonst erst auf, wenn ein
      #  abgebrochener Vorgang doppelt angefangen wird.
      - name: Zuordnung Vorgang zu Branch
        run: python .github/skripte/zuordnung.py --selbsttest

      #  Ein Fehler hier wirkt sich auf Modellwahl UND Label-Schutz aus, faellt aber nur
      #  an einer der beiden Stellen auf.
      - name: Scoped Labels erkennen
        run: python .github/skripte/scoped_labels.py --selbsttest

      #  Ein Labelname wird Teil eines API-Pfades. Faellt die Kodierung aus,
      #  spricht der Aufruf ein anderes Objekt an als gemeint (#30).
      - name: Labelname im API-Pfad
        run: python .github/skripte/api_pfad.py --selbsttest

      #  labels.json ist die einzige Quelle fuer den Label-Katalog UND fuer
      #  geschuetzt.py - ein Fehler hier faellt sonst erst an einer der beiden
      #  Stellen auf, nie an beiden zugleich.
      - name: Label-Katalog lesen
        run: python .github/skripte/labels_lesen.py --selbsttest

      #  Entscheidet, was label-abgleich.yml in einem Zielprojekt anlegt,
      #  umbenennt oder loescht. Ein Fehler hier faellt sonst erst in einem
      #  fremden Projekt auf, das sich den Katalog von hier holt.
      - name: Label-Abgleich planen
        run: python .github/skripte/label_abgleich.py --selbsttest

      #  Modell und Aufwand entscheiden, was ein Lauf kostet. Ein Fehler in der Zuordnung
      #  von Label zu Modell faellt sonst erst an der Rechnung auf.
      - name: Modellwahl aus den Labels
        run: python .github/skripte/modellwahl.py --selbsttest

      #  Entscheidet, wer die Steuerlabel setzen darf. Ein Fehler hier faellt sonst erst
      #  auf, wenn jemand mit zu wenig oder zu viel Recht ein Label setzt - siehe
      #  label-waechter.yml.
      - name: Berechtigung fuer die Steuerlabel
        run: python .github/skripte/berechtigt.py --selbsttest

      #  Welche Label ueberhaupt geschuetzt sind. Ein Fehler hier faellt sonst erst auf,
      #  wenn ein scoped Label ungeschuetzt bleibt oder ein fremdes Label faelschlich
      #  zurueckgenommen wird.
      - name: Welche Label geschuetzt sind
        run: python .github/skripte/geschuetzt.py --selbsttest

      #  Bricht das Blockzitat des Fortschrittskommentars auf, steht die Haelfte des
      #  Standes als Fliesstext im Vorgang - und findet die Marke ihn nicht wieder, legt
      #  jeder Lauf einen neuen an.
      - name: Fortschrittskommentar
        run: python .github/skripte/fortschritt.py --selbsttest

      #  Liest eine Datei, deren Aufbau nicht zugesagt ist. Findet es etwas nicht, MUSS
      #  dort 'nicht ermittelbar' stehen - eine erfundene Zahl waere schlimmer als gar
      #  keine.
      - name: Abschlusskommentar
        run: python .github/skripte/abschluss.py --selbsttest

  #  reiser-flow wendet pruefung-vermerken.yml auf sich selbst an
  #  (f-reiser/reiser-flow#11) - ueber den lokalen Pfad, damit dieser Lauf den
  #  Stand des eigenen main ausfuehrt. "if: always()" gehoert hierher, nicht in
  #  die aufgerufene Datei: gerade das ROTE Ergebnis soll im Vorgang stehen.
  vermerken:
    needs: pruefung
    if: always()
    uses: ./.github/workflows/pruefung-vermerken.yml
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      ergebnis: ${{ needs.pruefung.result }}
