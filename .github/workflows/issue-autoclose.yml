name: Issue automatisch schliessen

# Wiederverwendbarer Workflow (workflow_call). Ein Projekt bindet ihn per Zeitplan ein
# und nennt das Konto, dessen Merge als "Issue abgearbeitet" zaehlt:
#
#   on:
#     schedule: [{ cron: "*/10 * * * *" }]
#     workflow_dispatch:
#   jobs:
#     issue-autoclose:
#       uses: f-reiser/reiser-flow/.github/workflows/issue-autoclose.yml@<tag>
#       with:
#         maintainer-login: ${{ vars.MAINTAINER_LOGIN }}
#
# Erkennung ueber den Branchnamen (issue-<nr>-<slug>, siehe git-branch-strategie), nicht
# ueber GitHub-Cross-References - Details und Begruendung in .github/skripte/issue_autoclose.py.
# Ein geschlossener, nicht gemergter Pull Request schliesst nie automatisch ein Issue;
# das bleibt eine Entscheidung des Maintainers.

on:
  workflow_call:
    inputs:
      maintainer-login:
        description: >
          GitHub-Login, dessen Merge eines Pull Request als "Issue abgearbeitet" zaehlt.
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-autoclose-${{ github.repository }}

jobs:
  issue-autoclose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      #  job.workflow_sha, nicht github.workflow_ref: In einem aufgerufenen Workflow
      #  zeigt der github-Kontext auf den AUFRUFER. Hier stand bis zum 18.09.2026
      #  dessen Ref - der Checkout holte damit den main-Stand dieses Repositories
      #  statt des Tags, auf den der Aufrufer gepinnt hatte, und auf einem
      #  Feature-Branch des Aufrufers waere er ins Leere gelaufen.
      #  Begruendung, Belege und die Pruefung dagegen: .github/pruefe_workflows.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: f-reiser/reiser-flow
          ref: ${{ job.workflow_sha }}
          path: _reiser-flow
          sparse-checkout: .github/skripte

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Selbsttest der Entscheidungslogik
        run: python3 _reiser-flow/.github/skripte/issue_autoclose.py --selbsttest

      - name: Offene Issues gegen gemergte Pull Requests abgleichen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAINTAINER_LOGIN: ${{ inputs.maintainer-login }}
        run: python3 _reiser-flow/.github/skripte/issue_autoclose.py
