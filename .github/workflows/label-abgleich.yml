name: Label-Abgleich

# Wiederverwendbarer Workflow (workflow_call). Bringt den Label-Katalog aus
# labels.json in einem Projekt auf den aktuellen Stand - Farbe, Beschreibung,
# Umbenennung und Loeschung nicht mehr gefuehrter Label inklusive (Logik in
# .github/skripte/label_abgleich.py, f-reiser/reiser-flow#54). Ein Projekt
# bindet ihn ein, wenn es den Katalog dieses Repositories uebernehmen will:
#
#   on:
#     push:
#       branches: [main]
#       paths: [.github/workflows/label-abgleich.yml]
#     schedule:
#       - cron: "17 4 * * 1"   # woechentlich - siehe "WARUM AUCH cron:" unten
#     workflow_dispatch:
#   jobs:
#     label-abgleich:
#       uses: f-reiser/reiser-flow/.github/workflows/label-abgleich.yml@<tag>
#       permissions:            # MUSS der Aufrufer setzen
#         issues: write
#
# WARUM AUCH cron:, NICHT NUR push:
# Ein reiner push-Trigger auf die eigene Wrapper-Datei greift nur, wenn ein
# Projekt seinen Versions-Tag bewusst nachzieht - das ist wieder eine Sache,
# an die der Nutzer denken muesste (f-reiser/reiser-flow#54, Kommentar). Mit
# einem zusaetzlichen "schedule:" holt sich jedes einbindende Projekt jede
# Aenderung am Katalog von selbst, sobald @<tag> auf eine neuere Fassung
# zeigt - unabhaengig davon, ob im Projekt gerade sonst etwas passiert.
#
# WAS FARBE VS. BESCHREIBUNG UNTERSCHEIDET, WAS UMBENANNT UND WAS GELOESCHT
# WIRD, STEHT NICHT HIER
# Das ist die Logik von label_abgleich.py (Docstring dort) - diese Datei
# verbindet sie nur mit "gh" und dem Ziel-Repository.
#
# WARUM DER AUFRUFER "paths:" SETZT, NICHT DIESE DATEI
# Ein aufgerufener Workflow kennt seinen Aufruf-Kontext nicht - "paths:" auf
# ".github/labels.json" wuerde hier auf das FALSCHE Repository zeigen (das des
# Aufrufers, nicht dieses hier). Der Aufrufer entscheidet selbst, wann er den
# Abgleich anstoesst.

on:
  workflow_call:

permissions:
  issues: write

jobs:
  abgleich:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      #  Nur labels.json und die Skripte, aus genau dem Commit, aus dem auch
      #  diese Datei stammt (job.workflow_sha - im github-Kontext stuende der
      #  AUFRUFER, siehe .github/pruefe_workflows.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: f-reiser/reiser-flow
          ref: ${{ job.workflow_sha }}
          path: _reiser-flow
          sparse-checkout: |
            .github/labels.json
            .github/skripte

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Katalog abgleichen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABELS_JSON: ${{ github.workspace }}/_reiser-flow/.github/labels.json
        run: python3 "$GITHUB_WORKSPACE/_reiser-flow/.github/skripte/label_abgleich.py"
