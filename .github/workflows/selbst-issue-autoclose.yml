name: Selbst-Issue-Autoclose

# reiser-flow wendet issue-autoclose.yml auf sich selbst an, damit ein Issue
# hier automatisch schliesst, sobald sein Pull Request vom Maintainer-Konto
# gemergt wurde (f-reiser/reiser-flow#11) - ueber den lokalen Pfad, damit
# dieser Lauf den Stand des eigenen main ausfuehrt.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  issue-autoclose:
    uses: ./.github/workflows/issue-autoclose.yml
    permissions:
      contents: read
      issues: write
      pull-requests: read
    with:
      maintainer-login: ${{ vars.MAINTAINER_LOGIN }}
