name: Selbst-Label-Abgleich

# reiser-flow wendet label-abgleich.yml auf sich selbst an: der Katalog aus
# .github/labels.json landet damit auch in diesem Repository, sobald er sich
# aendert (f-reiser/reiser-flow#11) - ueber den lokalen Pfad, damit dieser Lauf
# den Stand des eigenen main ausfuehrt. Das woechentliche "schedule:" faengt
# zusaetzlich Loeschungen auf, die erst spaeter unblockiert werden (ein Label
# aus "entfernt", das beim Katalog-Commit noch in Verwendung war) - siehe
# label-abgleich.yml, "WARUM AUCH cron:".

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  label-abgleich:
    uses: ./.github/workflows/label-abgleich.yml
    permissions:
      issues: write
